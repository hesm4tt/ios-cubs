# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

# DRAFT ONLY: not buildable or bootable until CUBS UEFI and RAM map are resolved.
# Raw live Android FDT, not a validated pre-OS CUBS boot DTB. It includes runtime values.
# Keep this profile disabled until CUBS UEFI, its memory map, GOP and payload ranges are verified.
NAME="Google Pixel 11 (cubs)"
KIND=phone                      # phone | qemu
SOC="Google Tensor G6 (malibu)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Unverified proposal: Mu-Silicium UEFI would need a CUBS port and proof that the Pixel boot chain can launch it.
UEFI_TARGET=cubs
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=$HOME/unixnu-pixel11/cubs-live-2026-10-22/live.dtb
FD_BASE=  # TODO: determine from the CUBS UEFI memory map
FD_SIZE=  # TODO: determine from the CUBS UEFI memory map
PAYLOAD_BASE=  # TODO: verify free RAM and reserved ranges

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0x00000000  # TODO: use the base reported by CUBS UEFI GOP
WIFI_ATH11K=0                   # 1: build the ath11k Wi-Fi driver into the kernel (WCN6750 radios)

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="cpus=7"
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE=""
